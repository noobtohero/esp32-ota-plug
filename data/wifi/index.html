<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WiFi Manager</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>📡 WiFi Setup</h2>
            <p class="subtitle">Select a network to connect</p>
            
            <div id="status-box" class="hidden">Checking...</div>
            
            <button type="button" id="scan-btn" onclick="scanWifi()">
                <span class="icon">🔍</span> Scan Networks
            </button>
            <div id="spinner" class="spinner hidden"></div>
            
            <div id="networks-list" class="list-container hidden"></div>

            <div class="divider">OR MANUAL</div>

            <form id="connect-form" onsubmit="connectWifi(event)">
                <div class="input-group">
                    <label>Network Name (SSID)</label>
                    <input type="text" id="ssid" placeholder="Enter SSID" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="pass" placeholder="Enter Password">
                        <span id="eye-icon" onclick="togglePass()" class="eye-btn">👁️</span>
                    </div>
                </div>
                <button type="submit" class="primary-btn">Save & Connect</button>
            </form>

            <div class="divider">DANGER ZONE</div>
            <button type="button" class="danger-btn" onclick="resetWifi()">⚠️ Factory Reset WiFi</button>
        </div>
    </div>
    <script src="app.js?v=2"></script>
</body>
</html>
